<!-- convite -->
<main class="ingresso" id="convite">
  <div class="parte principal">
    <div class="letreiro">🍽️ Reserva especial</div>
    <h1><span class="nome" data-nome></span>quer sair comigo?</h1>

    <section class="dados">
      <div class="dado"><span class="ic">📍</span><div><small>Onde</small><p>Madero &amp; Jeronimo Track Glória</p>
        <a class="mapa" href="https://www.google.com/maps/search/?api=1&amp;query=Madero+%26+Jeronimo+Track+Gl%C3%B3ria%2C+R.+Cambori%C3%BA%2C+31%2C+Joinville" target="_blank" rel="noopener">
          <img src="assets/madero.jpg" alt="Fachada do Madero &amp; Jeronimo Track Glória" draggable="false">
          <span>R. Camboriú, 31 · Glória ↗</span>
        </a>
      </div></div>
      <div class="dado"><span class="ic">📅</span><div><small>Quando</small><p>Sábado, 17/10, entre 19h30 e 20h</p></div></div>
    </section>
  </div>

  <div class="parte canhoto">
    <p class="pergunta">E aí, topa?</p>
    <div class="botoes">
      <button id="sim" type="button">Sim 🍔</button>
      <button id="nao" type="button">Não</button>
    </div>
    <div class="codigo"></div>
    <div class="serie">MESA PARA 2 · Nº 0001</div>
  </div>
</main>

    <div class="codigo"></div>
    <div class="serie">MESA PARA 2 · Nº 0001</div>

</main>
